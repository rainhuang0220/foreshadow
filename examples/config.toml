# examples/config.toml  — also the documented user schema

[discovery]
star_min = 50                 # legacy; v2 search uses early/rising bands
star_max = 8000
early_star_min = 10
early_star_max = 400
rising_star_min = 100
rising_star_max = 3000
pool_a_quota = 40             # exposure caps, not fill targets
pool_b_quota = 50
pool_c_quota = 30
per_query_floor = 6
pushed_within_days = 45       # templates {pushed45} = today − this
max_candidates = 120          # union of watchlist + observation + search
fresh_discovery_floor = 24    # seats reserved for new search after watchlist
observation_ttl_days = 14     # system panel TTL from added_on; covers v7 + missed days
observation_admit_max = 24    # new system promotions per day (not Official pins)
observation_admit_min = 25    # min v1 opportunity to promote; not Official 55
max_deep_hydrate = 30
max_watchlist_deep = 20       # Phase B reserved for rankable watchlist only (watch/interested/investigate); enter does not consume
max_medium_hydrate = 15
phase_b_pool_a = 15
phase_b_pool_b = 10
phase_b_pool_c = 5
phase_b_per_query_floor = 2
medium_pool_a = 15
medium_pool_b = 10
medium_pool_c = 5
per_page = 25                 # GraphQL search first:N; do not paginate to 1000
exclude_forks = true          # drop forks in discovery. H2 ALWAYS vetoes Top 5 even if false
exclude_archived = true
# Hydrate/pre-rank language bonus only. NEVER a cartesian product of search × languages.
# Empty = no language bonus. Pool B systems already embeds language:Rust.
languages = ["Python", "Rust", "TypeScript", "Go", "C++"]

[scoring]
# Locked product weights in **points** that MUST sum to 100.
# `momentum_weight = 0.20` is invalid (exit 2). Tests pin these defaults.
momentum_weight = 20
real_user_weight = 15
gap_weight = 15
contribution_opp_weight = 20
early_entry_weight = 15
direction_fit_weight = 10
maintainer_weight = 5
min_opportunity = 55
min_explosion = 35
score_version = "v1"          # official reader; dual-write always persists v1+v2
reject_cooldown_days = 90
later_skip_days = 14
max_per_owner = 2             # diversity in Top 5
window_slack_days = 1         # nearest snapshot ≤ t-N within this slack; else NA
# Activity Momentum (v2 Preview only). Not Opportunity v1. Not windows.v7.
activity_commit_7d_weight = 40
activity_commit_30d_weight = 25
activity_contributor_weight = 25
activity_release_weight = 10
activity_sat_commits_7d = 15
activity_sat_commits_30d = 30
activity_sat_contributors_7d = 4
activity_sat_releases_30d = 2

[github]
api_url = "https://api.github.com"
graphql_url = "https://api.github.com/graphql"
api_version = "2026-03-10"
timeout_seconds = 30
budget_graphql_points = 800
budget_rest = 400
max_retries = 3
search_spacing_ms = 2000

[llm]
enabled = false
provider = "openai"           # openai | anthropic | xai | custom
model = ""
base_url = ""                 # custom only
max_calls_per_run = 5         # one OpenAI-compatible call per selected card (≤5 cards)
