[project]
name = "foreshadow-radar"
version = "0.3.0"
description = "Find what the future has already foreshadowed."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "rainhuang0220" }]
dependencies = [
  "httpx",
  "pydantic>=2",
  "typer",
  "platformdirs",
]

[project.scripts]
foreshadow = "foreshadow.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# sql/, directions.toml, and board/assets/ live inside this package and are
# included once. Re-listing them under Hatch forced inclusion duplicates zip entries.
packages = ["src/foreshadow"]

[dependency-groups]
dev = ["pytest", "ruff", "respx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
src = ["src", "tests"]
