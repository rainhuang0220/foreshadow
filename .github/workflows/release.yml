name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  dist:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Tag equals pyproject and CLI
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER=$(uv run python -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          PKG=$(uv run python -c "from foreshadow import __version__; print(__version__)")
          echo "tag=$TAG pyproject=$VER package=$PKG"
          test "$TAG" = "$VER"
          test "$TAG" = "$PKG"

      - name: Sync and packaging smoke
        run: |
          uv sync --group dev
          uv run pytest tests/test_packaging.py -q
        env:
          NO_NETWORK: "1"
