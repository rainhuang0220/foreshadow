# Production Board: https://foreshadow.plainlist.space/
# Requires DNS A record + certbot for that hostname.
# Keep foreshadow-666.conf as a temporary HTTP alias (no OAuth callback).

server {
    listen 80;
    listen [::]:80;
    server_name foreshadow.plainlist.space;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }

    location / {
        return 301 https://foreshadow.plainlist.space$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name foreshadow.plainlist.space;

    ssl_certificate     /etc/letsencrypt/live/foreshadow.plainlist.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/foreshadow.plainlist.space/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;

    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}
